[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-memory-mcp-server"
version = "0.1.0"
description = "Local stdio MCP server for Codex engineering memory."
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.2.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
